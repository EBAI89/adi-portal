# ADI portal — Render Blueprint for the phone deploy kit (server.js + package.json + render.yaml).
# Render → New → Blueprint → choose this repository. Add email/SMS/MoMo keys later under the service's Environment tab.
databases:
  - name: adi-portal-db
    databaseName: adi_portal
    plan: basic-256mb
services:
  - type: web
    name: adi-portal
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: adi-portal-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: INBOX_EMAIL
        value: e.bill@adiuniversity.com
      # Real delivery channels (see NOTIFICATIONS-SETUP.md). The secret values are entered once in the Render Environment tab, never in the repository.
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: ADI University <no-reply@adiuniversity.com>
      - key: SMS_PROVIDER
        value: africastalking
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: WHATSAPP_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WA_FROM
        sync: false
      - key: TWILIO_WA_CONTENT_SID_PROOF
        sync: false
      - key: PUBLIC_URL
        value: https://adi-portal.onrender.com
      - key: MOMO_MODE
        value: "off"
