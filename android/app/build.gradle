// ADI Portal — Android app. The first screen shows pages packed inside the app (programmes, fees, contacts: no internet,
// no server). The portal itself opens full screen (Trusted Web Activity), with the same sign-in, alerts, uploads and
// downloads as in the browser, and the portal's own offline storage.
plugins { id 'com.android.application' }

def buildNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'com.adiuniversity.portal'
    compileSdk 35

    defaultConfig {
        applicationId 'com.adiuniversity.portal'
        minSdk 23
        targetSdk 34   // 34 keeps the system bars outside the page on Android 15
        versionCode buildNo
        versionName "1.0.${buildNo}"
    }
    signingConfigs {
        release {
            storeFile rootProject.file(System.getenv('ADI_KEYSTORE_FILE') ?: 'adi-release.jks')
            storePassword System.getenv('ADI_KEYSTORE_PASSWORD') ?: 'adi-portal-app'
            keyAlias 'adi'
            keyPassword System.getenv('ADI_KEYSTORE_PASSWORD') ?: 'adi-portal-app'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    lint { checkReleaseBuilds false; abortOnError false }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
