<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>American Ditek Institute (ADI)</title>
<style>
:root{--navy:#0B2559;--royal:#2447B8;--gold:#C9A227;--gold-soft:#F4E9C1;--bg:#F2F4F9;--card:#fff;--ink:#0F1A33;--muted:#5A6580;--line:#D9DFEC;--soft:#E9EEF8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
a{color:var(--royal)}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:3px solid var(--gold)}
.top img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:8px;padding:2px;flex:none}
.top b{flex:1;font-size:1rem;line-height:1.2;min-width:0}
.lang{display:flex;border:1px solid rgba(255,255,255,.55);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:#fff;font:inherit;font-weight:700;font-size:.85rem;padding:8px 11px;min-height:40px}
.lang button.on{background:var(--gold);color:var(--navy)}
main{padding:14px;max-width:760px;margin:0 auto}
h1{font-size:1.5rem;line-height:1.2;margin:4px 0 10px;text-wrap:balance}
h2{font-size:1.2rem;line-height:1.25;margin:18px 0 8px;text-wrap:balance}
h3{font-size:1.02rem;margin:18px 0 8px}
p{margin:8px 0}
ul{margin:8px 0;padding-left:20px}
li{margin:3px 0}
.muted{color:var(--muted)}.small{font-size:.86rem}.nw{white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.card h2:first-child,.card h3:first-child{margin-top:0}
.hero{background:var(--navy);color:#fff;border-radius:14px;padding:18px 16px;margin-bottom:12px}
.hero .eyebrow{color:var(--gold);font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.hero h1{font-size:1.7rem;margin:6px 0 8px}
.hero p{color:#DCE4F7;margin:0}
.btn{display:block;text-align:center;text-decoration:none;font-weight:700;border-radius:10px;padding:13px 14px;min-height:48px;margin:10px 0 2px;background:var(--navy);color:#fff;border:2px solid var(--navy)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.line{background:#fff;color:var(--navy)}
.hint{font-size:.84rem;color:var(--muted);text-align:center;margin:2px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.tiles a{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 6px;text-align:center;text-decoration:none;color:var(--navy);font-weight:700;font-size:.92rem;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tiles svg,.tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.note{background:var(--gold-soft);border:1px solid #E3D18B;border-radius:10px;padding:10px 12px;font-size:.88rem;margin:12px 0}
.levels{display:flex;gap:6px;margin:10px 0 12px}
.levels a{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:.9rem;padding:11px 4px;min-height:44px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--navy)}
.levels a.on{background:var(--navy);color:#fff;border-color:var(--navy)}
details{background:#fff;border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:0 12px}
summary{font-weight:700;padding:13px 0;min-height:48px;cursor:pointer;color:var(--navy)}
summary .muted{font-weight:400}
details ul{margin:0 0 12px}
.tw{overflow-x:auto;margin:8px -14px;padding:0 14px}
table{border-collapse:collapse;width:100%;background:#fff;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{background:var(--soft);color:var(--navy);font-size:.72rem;text-transform:uppercase}
table.wide{font-size:.8rem}table.wide th{font-size:.66rem}
.socrow{display:grid;gap:8px;margin:6px 0}
.socbtn{display:block;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px;background:var(--soft);color:var(--ink)}
.socbtn b{display:block;color:var(--navy)}
.socbtn span{font-size:.86rem;color:var(--muted)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;text-decoration:none;color:var(--muted);font-size:.74rem;font-weight:600}
.tabbar a.on{color:var(--navy)}
.tabbar a.on svg{stroke:var(--gold)}
.foot{font-size:.82rem;color:var(--muted);text-align:center;margin:18px 0 6px}
</style>
</head>
<body>
<header class="top"><img src="adi-logo.png" alt=""><b>American Ditek Institute (ADI)</b>

<main id="v"></main>

<script>
const DATA = {"en": {"home": {"eyebrow": "Authorized by MINESUP · Yaoundé · Buea", "h1": "Study today. Lead tomorrow.", "p": "HND, BTS, Bachelor and Master programmes in English and French, delivered in Yaoundé and Buea under the authorization of the Ministry of Higher Education (MINESUP).", "mentor": "× Academic mentorship Mentored by the University of Buea American Ditek Institute (ADI) draws on the experience of the University of Buea, an established state university, which guides it in the quality of its programmes, teaching and assessment. Two institutions, one standard: graduates who are competent, principled and ready to lead. Read about our partnership"}, "util": ["Authorized by the Ministry of Higher Education (MINESUP)", "+237 651 187 835\ne.bill@adiuniversity.com"], "fees": "<h2>Fees and payment schedule — 2026/2027<\/h2><p class=\"muted\">per session (Cameroonian students)<\/p>\n<h3>Registration fees<\/h3><div class=\"tw\"><table class=\"rtab\"><thead><tr><th>Item<\/th><th>Amount<\/th><\/tr><\/thead><tbody><tr><td class=\"nw\">Registration<\/td><td class=\"nw\">50,000 XAF<\/td><\/tr><tr><td>Student's savings account (optional)<\/td><td class=\"nw\">15,000 XAF<\/td><\/tr><tr><td>Student T-shirt<\/td><td class=\"nw\">5,000 XAF<\/td><\/tr><tr><td>Student ID card<\/td><td class=\"nw\">5,000 XAF<\/td><\/tr><tr><td>Medical examination (Fresh student / Returning student)<\/td><td>5,000 XAF / 3,000 XAF<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 class=\"gap\">Tuition<\/h3><p class=\"muted\">Total fee = registration fee + tuition instalments. The optional student savings account is not included in any total.<\/p><div class=\"tw\"><table class=\"rtab\"><thead><tr><th>S/N<\/th><th>Programme<\/th><th>Registration<\/th><th>Tuition instalments (XAF)<\/th><th>Total fee<\/th><\/tr><\/thead><tbody><tr><td class=\"nw\">A<\/td><td>HND (non-engineering)<\/td><td class=\"nw\">50,000 XAF<\/td><td>100,000 · 75,000 · 75,000 · 50,000<\/td><td class=\"nw\"><b>350,000 XAF<\/b><\/td><\/tr><tr><td class=\"nw\">B<\/td><td>HND (engineering)<\/td><td class=\"nw\">50,000 XAF<\/td><td>150,000 · 100,000 · 50,000 · 50,000<\/td><td class=\"nw\"><b>400,000 XAF<\/b><\/td><\/tr><tr><td class=\"nw\">C<\/td><td>Bachelor and Top-Up (Social &amp; Management Sciences, Health, Education, Agriculture)<\/td><td class=\"nw\">50,000 XAF<\/td><td>150,000 · 100,000 · 75,000 · 75,000 · 50,000<\/td><td class=\"nw\"><b>500,000 XAF<\/b><\/td><\/tr><tr><td class=\"nw\">D<\/td><td>Bachelor (engineering)<\/td><td class=\"nw\">50,000 XAF<\/td><td>150,000 · 100,000 · 100,000 · 100,000 · 50,000<\/td><td class=\"nw\"><b>550,000 XAF<\/b><\/td><\/tr><tr><td class=\"nw\">E<\/td><td>Professional Bachelor — Year 1<\/td><td class=\"nw\">50,000 XAF<\/td><td>100,000 · 75,000 · 75,000 · 50,000<\/td><td class=\"nw\"><b>350,000 XAF<\/b><\/td><\/tr><tr><td class=\"nw\">F<\/td><td>Professional Bachelor — Year 2<\/td><td class=\"nw\">50,000 XAF<\/td><td>150,000 · 100,000 · 50,000 · 50,000<\/td><td class=\"nw\"><b>400,000 XAF<\/b><\/td><\/tr><tr><td class=\"nw\">G<\/td><td>Professional Bachelor — Years 3 and 4<\/td><td class=\"nw\">50,000 XAF<\/td><td>150,000 · 125,000 · 100,000 · 75,000<\/td><td class=\"nw\"><b>500,000 XAF<\/b><\/td><\/tr><tr><td class=\"nw\">H<\/td><td>All Master's programmes<\/td><td class=\"nw\">50,000 XAF<\/td><td>200,000 · 150,000 · 150,000 · 100,000 · 100,000<\/td><td class=\"nw\"><b>750,000 XAF<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<h3 class=\"gap\">Tuition installment plan<\/h3><div class=\"tw\"><table class=\"rtab\"><thead><tr><th>Item<\/th><th>Window<\/th><\/tr><\/thead><tbody><tr><td>Installment 1<\/td><td>25 September 2026 → 20 October 2026<\/td><\/tr><tr><td>Installment 2<\/td><td>25 October 2026 → 20 November 2026<\/td><\/tr><tr><td>Installment 3<\/td><td>3 January 2027 → 25 January 2027<\/td><\/tr><tr><td>Installment 4<\/td><td>26 January 2027 → 28 February 2027<\/td><\/tr><tr><td>Installment 5<\/td><td>1 March 2027 → 15 April 2027<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 class=\"gap\">Admission requirements<\/h3><p class=\"muted\">Applicants must submit the following documents:<\/p><ul><li>A photocopy of the birth certificate<\/li><li>A photocopy of the national identity card (or a valid passport, for international students)<\/li><li>A certified copy of the Advanced Level Certificate or result slip, or its recognised equivalent<\/li><li>A certified copy of the Ordinary Level Certificate or result slip, or its recognised equivalent<\/li><li>A certified copy of the Higher National Diploma (HND) certificate or result testimonial, or its recognised equivalent (Bachelor Top-Up programmes only)<\/li><li>A certified copy of the Bachelor's degree certificate or testimonial, or its recognised equivalent (all Master's programmes)<\/li><li>An official Bachelor's transcript (Master's applicants only)<\/li><\/ul>\n<div class=\"note\">Pay by MoMo to <b>+237678305489 (GLOBAL INVESTMENT CREDIT COOPERATIVE BOD) for registration and tuition fees, or +237674225990 (WILLIAM EGBE EBAI) for all other payments<\/b>. Foreign students must provide a passport number. Published fees apply to Cameroonian students; international fees: contact e.bill@adiuniversity.com.<\/div>", "contact": "<div class=\"card\"><h2>Inquiries and complaints<\/h2><p>Please write to us at <a href=\"mailto:e.bill@adiuniversity.com\">e.bill@adiuniversity.com<\/a>. Every inquiry or complaint is logged and answered by the administration.<\/p><p>P.O. Box 31460, Yaoundé<br/>+237 651 187 835<br/>🌐 <a class=\"\" href=\"https://www.adiuniversity.com\">www.adiuniversity.com<\/a><\/p><\/div>\n<div><div class=\"card\"><h3>Connect with us<\/h3><p class=\"f\"><b>📘 Follow us on Facebook<\/b><\/p><div class=\"socrow\"><a class=\"socbtn fb\" href=\"https://www.facebook.com/ADIUNIVERSITY\"><b>American Ditek Institute<\/b><span>For English-speaking audiences<\/span><\/a><a class=\"socbtn fb\" href=\"https://www.facebook.com/share/1DxLMFTsd8/\"><b>Université ADI – Institut américain Ditek<\/b><span>For French-speaking audiences<\/span><\/a><\/div>\n<p class=\"f\"><b>💬 WhatsApp<\/b><\/p><div class=\"socrow\"><a class=\"socbtn wa\" href=\"https://wa.me/237651187835?text=Hello%20ADI%20University%2C%20\"><b>Yaoundé Campus<\/b><span>English correspondence · <span class=\"nw\">+237 651 187 835<\/span><\/span><\/a><a class=\"socbtn wa\" href=\"https://wa.me/237657936576?text=Hello%20ADI%20University%2C%20\"><b>Yaoundé Campus<\/b><span>French correspondence · <span class=\"nw\">+237 657 936 576<\/span><\/span><\/a><a class=\"socbtn wa\" href=\"https://wa.me/237651044896?text=Hello%20ADI%20University%2C%20\"><b>Buea Campus<\/b><span><span class=\"nw\">+237 651 044 896<\/span><\/span><\/a><\/div><\/div><div class=\"card gap\"><h3>Pay by MoMo to <b>+237678305489 (GLOBAL INVESTMENT CREDIT COOPERATIVE BOD) for registration and tuition fees, or +237674225990 (WILLIAM EGBE EBAI) for all other payments<\/b><\/h3><p class=\"muted\">1) Send the amount by MoMo to +237678305489 (GLOBAL INVESTMENT CREDIT COOPERATIVE BOD) for registration and tuition fees, or +237674225990 (WILLIAM EGBE EBAI) for all other payments. 2) Enter the transaction ID you received. 3) The finance office confirms and your receipt becomes official.<\/p><\/div><\/div>", "prog": {"HND": "\n<p><b>HND — Higher National Diploma<\/b> — Entry requirement (indicative): GCE Advanced Level (2 papers) or Baccalauréat / equivalent.<\/p>\n<details class=\"fac\"><summary>Field of Management <span class=\"muted small\">(17 specialties)<\/span><\/summary><ul><li>Management Assistant<\/li><li>Human Resources Management<\/li><li>Logistics and Transportation Management<\/li><li>Project Management<\/li><li>Information Systems Management<\/li><li>Business Administration<\/li><li>Public Administration<\/li><li>Operation of Air Transport<\/li><li>Management of NGOs<\/li><li>Quality Management<\/li><li>Sport Management<\/li><li>Local Government Management (Accounting and Finance)<\/li><li>Local Government Management (Taxation)<\/li><li>Local Government Management (Administration)<\/li><li>Statistics<\/li><li>Events Management<\/li><li>Ports and Shipping Management<\/li><\/ul><\/details><details class=\"fac\"><summary>Field of Engineering and Technology <span class=\"muted small\">(12 specialties · Engineering &amp; Technology)<\/span><\/summary><ul><li>Software Engineering<\/li><li>Hardware Maintenance<\/li><li>Network and Security<\/li><li>Telecommunications<\/li><li>Database Management<\/li><li>Graphics Web Design<\/li><li>E-commerce<\/li><li>Digital Marketing<\/li><li>Computer Science &amp; Networks<\/li><li>Cyber Security<\/li><li>Artificial Intelligence<\/li><li>Industrial Computing and Automation<\/li><\/ul><\/details><details class=\"fac\"><summary>Field of Business and Finance <span class=\"muted small\">(11 specialties)<\/span><\/summary><ul><li>Accountancy<\/li><li>Marketing<\/li><li>Wholesale Trade<\/li><li>Banking and Finance<\/li><li>International Trade<\/li><li>Microfinance<\/li><li>Insurance<\/li><li>Institute of Commercial Management (ICM)<\/li><li>Secretarial Studies<\/li><li>Customs and Transit<\/li><li>Tax Management<\/li><\/ul><\/details><details class=\"fac\"><summary>Field of Legal Careers <span class=\"muted small\">(4 specialties)<\/span><\/summary><ul><li>Legal Assistant<\/li><li>Business Law<\/li><li>Career in the Stock Exchange<\/li><li>Land Law<\/li><\/ul><\/details><details class=\"fac\"><summary>Field of Health Sciences <span class=\"muted small\">(17 specialties)<\/span><\/summary><ul><li>Nursing<\/li><li>Medical Laboratory Sciences<\/li><li>Pharmacy Technology<\/li><li>Midwifery<\/li><li>Healthcare Management<\/li><li>Medical Laboratory Scientist (MLS)<\/li><li>Public Health<\/li><li>Medical Imaging Technology<\/li><li>Dental Therapy<\/li><li>Dental Prosthesis<\/li><li>Optician / Clinical Optometry<\/li><li>Physiotherapy<\/li><li>Ophthalmic Technician<\/li><li>Prosthetics and Orthotics<\/li><li>Ultrasonography<\/li><li>Nutrition and Dietetics<\/li><li>Health Sanitary Inspector<\/li><\/ul><\/details><details class=\"fac\"><summary>Field of Education <span class=\"muted small\">(8 specialties)<\/span><\/summary><ul><li>Didactics<\/li><li>Curriculum Development &amp; Teaching<\/li><li>Education Management and Administration<\/li><li>Distance and Continuing Education<\/li><li>Vocational Guidance and Counseling<\/li><li>Science of Education<\/li><li>Special Education<\/li><li>Inclusive Education<\/li><\/ul><\/details><details class=\"fac\"><summary>Field of Agriculture <span class=\"muted small\">(4 specialties)<\/span><\/summary><ul><li>Soil Science<\/li><li>Crop Protection<\/li><li>Animal Science (Husbandry)<\/li><li>Crop Production Technology<\/li><\/ul><\/details>\n<p class=\"muted small\">Official programme titles are shown as published by ADI.<\/p>", "BTS": "\n<p><b>BTS — Brevet de Technicien Supérieur<\/b> — Entry requirement (indicative): Baccalauréat, GCE Advanced Level or equivalent.<\/p>\n<details class=\"fac\"><summary>Health Sciences <span class=\"muted small\">(5 specialties)<\/span><\/summary><ul><li>Sciences de laboratoire médical<\/li><li>Technologie pharmaceutique<\/li><li>Sage-femme<\/li><li>Scientifique de laboratoire médical<\/li><li>Santé publique<\/li><\/ul><\/details><details class=\"fac\"><summary>Management <span class=\"muted small\">(5 specialties)<\/span><\/summary><ul><li>Assistant de gestion<\/li><li>Gestion des ressources humaines<\/li><li>Gestion de la logistique et du transport<\/li><li>Gestion de projet<\/li><li>Gestion des systèmes d'information<\/li><\/ul><\/details><details class=\"fac\"><summary>Engineering and Technology <span class=\"muted small\">(3 specialties · Engineering &amp; Technology)<\/span><\/summary><ul><li>Génie logiciel<\/li><li>Réseau et sécurité<\/li><li>Télécommunications<\/li><\/ul><\/details><details class=\"fac\"><summary>Business and Finance <span class=\"muted small\">(7 specialties)<\/span><\/summary><ul><li>Comptabilité des entreprises et gestion<\/li><li>Marketing<\/li><li>Commerce de gros<\/li><li>Banque et finance<\/li><li>Commerce international<\/li><li>Microfinance<\/li><li>Assurance<\/li><\/ul><\/details><details class=\"fac\"><summary>Legal Careers <span class=\"muted small\">(3 specialties)<\/span><\/summary><ul><li>Assistant juridique<\/li><li>Droit des affaires<\/li><li>Carrière dans la bourse<\/li><\/ul><\/details>\n<p class=\"muted small\">Official programme titles are shown as published by ADI.<\/p>", "BSC": "\n<p><b>Bachelor's degree<\/b> — Entry requirement (indicative): Professional Bachelor: at least four GCE Ordinary Level subjects (excluding Religious Studies) in one sitting plus at least two Advanced Level subjects in one sitting, or the Baccalauréat or an equivalent qualification recognised by the competent Cameroonian authority. Top-Up Bachelor (one year): HND, Advanced Diploma or equivalent in a relevant field.<\/p>\n<details class=\"fac\"><summary>Faculty of Health Sciences <span class=\"muted small\">(5 specialties)<\/span><\/summary><ul><li>B.Sc. Nursing Sciences<\/li><li>B.Sc. Midwifery Sciences<\/li><li>B.Sc. Medical Laboratory Sciences<\/li><li>B.Sc. Public Health &amp; Hygiene<\/li><li>B.Sc. Nutrition &amp; Dietetics<\/li><\/ul><\/details><details class=\"fac\"><summary>Faculty of Education <span class=\"muted small\">(6 specialties)<\/span><\/summary><ul><li>B.Ed. Special Education<\/li><li>B.Ed. Educational Psychology &amp; Behavioural Sciences<\/li><li>B.Ed. Educational Leadership, Policy &amp; Planning<\/li><li>B.Ed. Curriculum, Pedagogy &amp; Assessment Strategies<\/li><li>B.Ed. Educational Technology &amp; Digital Innovation<\/li><li>B.Sc. Clinical Psychology<\/li><\/ul><\/details><details class=\"fac\"><summary>School of Social and Management Sciences <span class=\"muted small\">(12 specialties)<\/span><\/summary><ul><li>Professional B.Sc. Accounting<details class=\"small\"><summary>Duration : 3 years (6 semesters) · Credits : minimum 180 (191 in the curriculum)<\/summary><p>To equip graduates with detailed knowledge of financial accounting, financial reporting, auditing, taxation, cost and management accounting and financial statement analysis, together with the information-technology skills needed to use accounting software and analytical tools.<\/p><p><b>Main courses (Handbook 2025–2026):<\/b> Financial Accounting I &amp; II, Cost and Management Accounting, Financial Reporting, Managerial Finance, Principles of Auditing, Tax Accounting, Public Sector Accounting, Corporate Treasury Management, Business Law (OHADA focus), Research Methods for Business, Advanced Financial Reporting, Advanced Managerial Accounting, Auditing and Assurance, Financial Management, Industrial Internship, Research Project; electives: Organisational Behaviour, Accounting Theory, Computerised Accounting, Forensic Accounting, IFRS.<\/p><\/details><\/li><li>Professional B.Sc. Banking and Finance<details class=\"small\"><summary>Duration : 3 years (6 semesters) · Credits : minimum 180<\/summary><p><b>Main courses (Handbook 2025–2026):<\/b> Financial Accounting I &amp; II, Principles of Micro- and Macroeconomics, Business Mathematics, Corporate Finance I &amp; II, Practice of Banking, Cost &amp; Management Accounting, Business Statistics, Business Law (OHADA), Financial Markets &amp; Institutions, Credit Analysis &amp; Management, Principles of Insurance, Industrial Attachment, International Finance, Financial Risk Management, Research Project.<\/p><\/details><\/li><li>Professional B.Sc. Management<details class=\"small\"><summary>Duration : 3 years (6 semesters) · Credits : minimum 180<\/summary><p><b>Main courses (Handbook 2025–2026):<\/b> Principles of Management, Organisational Behaviour, Human Resource Management, Marketing, Financial Management, Operations Management, Entrepreneurship, Strategic Management, International Business, Project Management, Business Ethics &amp; Corporate Governance, Industrial Attachment (MGT 306, 12 credits), Research Project (MGT 498, 12 credits).<\/p><\/details><\/li><li>Professional B.Sc. Human Resource Management<\/li><li>Professional B.Sc. Project Management<\/li><li>Professional B.Sc. Transport and Logistics<details class=\"small\"><summary>Duration : 3 years (6 semesters) · Credits : minimum 180<\/summary><p><b>Main courses (Handbook 2025–2026):<\/b> Principles of Logistics &amp; Supply Chain, Principles of Management, Micro- and Macroeconomics, Business Mathematics, Introduction to Transport Systems, Warehouse Management, Procurement &amp; Sourcing, Transport Economics, Inventory Management, Freight Forwarding &amp; Customs Procedures, Logistics Information Systems, International Logistics &amp; Trade, Port &amp; Terminal Management, Air &amp; Maritime Transport Management, Strategic Supply Chain Management, Green Logistics &amp; Sustainability, Industrial Internship (180+ hours), Research Project.<\/p><\/details><\/li><li>B.Sc. Accounting (Top-Up)<details class=\"small\"><summary>Duration : 1 year (2 semesters) · Credits : 68 (as stated in the Handbook; the course table lists 60)<\/summary><p>For holders of an HND or equivalent in Accounting or a related field.<\/p><p><b>Main courses (Handbook 2025–2026):<\/b> Advanced Financial Accounting I &amp; II, Advanced Management Accounting, Taxation: Principles &amp; Practice, Accounting Theory &amp; Professional Ethics, Business Research Methods, Auditing and Assurance Services, Corporate Governance &amp; Business Law, Research Project (12 credits).<\/p><\/details><\/li><li>B.Sc. Banking and Finance (Top-Up)<details class=\"small\"><summary>Duration : 1 year (2 semesters) · Credits : about 68–72<\/summary><p>For HND holders.<\/p><p><b>Main courses (Handbook 2025–2026):<\/b> Corporate Finance, Management of Financial Institutions, Investment Analysis &amp; Portfolio Management, Financial Markets &amp; Instruments, Financial Law &amp; Ethics, Business Research Methods, Financial Statement Analysis, Credit &amp; Financial Risk Management, International Finance, Professional Practice &amp; Seminar, Research Project.<\/p><\/details><\/li><li>B.Sc. Management (Top-Up)<\/li><li>B.Sc. Human Resource Management (Top-Up)<details class=\"small\"><summary>Duration : 1 year (2 semesters) · Credits : about 68<\/summary><p>For HND holders in HRM, Management or related fields.<\/p><p><b>Main courses (Handbook 2025–2026):<\/b> Strategic Human Resource Management, Labour Law &amp; Industrial Relations, Organisational Behaviour &amp; Development, Recruitment, Selection &amp; Talent Management, Business Ethics &amp; Corporate Governance, Business Communication &amp; Reporting, Performance &amp; Compensation Management, Training, Development &amp; Career Planning, Human Resource Information Systems (HRIS), Research Project in HRM (12 credits).<\/p><\/details><\/li><li>B.Sc. Project Management (Top-Up)<details class=\"small\"><summary>Duration : 1 year (2 semesters) · Credits : about 70<\/summary><p><b>Main courses (Handbook 2025–2026):<\/b> Principles of Project Management, Project Scope &amp; Time Management, Project Cost &amp; Financial Management, Organisational Behaviour &amp; Stakeholder Management, Business Law &amp; Contract Management, Advanced Professional Communication, Project Risk &amp; Quality Management, Agile Project Management &amp; Scrum, Project Management Software &amp; Tools (MS Project), Professional Practice &amp; PMP® Exam Preparation, Research Project (12 credits).<\/p><\/details><\/li><li>B.Sc. Transport and Logistics (Top-Up)<details class=\"small\"><summary>Duration : 1 year (2 semesters) · Credits : about 68<\/summary><p><b>Main courses (Handbook 2025–2026):<\/b> Principles of Supply Chain Management, Transport Economics &amp; Policy, Procurement &amp; Inventory Management, Warehouse &amp; Distribution Management, Business Law &amp; Contracts, Professional Communication &amp; Negotiation, International Logistics &amp; Freight Forwarding, Logistics Information Systems &amp; Technology, Quality Management &amp; Performance Metrics, Professional Practice &amp; Seminar, Research Project (12 credits).<\/p><\/details><\/li><\/ul><\/details><details class=\"fac\"><summary>Faculty of Engineering &amp; Technology <span class=\"muted small\">(6 specialties · Engineering &amp; Technology)<\/span><\/summary><ul><li>B.Eng. Artificial Intelligence &amp; Data Science<\/li><li>B.Eng. Software Engineering<\/li><li>B.Eng. Network &amp; Cyber Security<\/li><li>B.Eng. Computer Engineering<\/li><li>B.Eng. Telecommunications Engineering<\/li><li>B.Eng. Mechatronics &amp; Intelligent Systems<\/li><\/ul><\/details><details class=\"fac\"><summary>Faculty of Agriculture, Food &amp; Environmental Sciences <span class=\"muted small\">(5 specialties)<\/span><\/summary><ul><li>B.Sc. Crop &amp; Environmental Sciences<\/li><li>B.Sc. Animal Science &amp; Fisheries<\/li><li>B.Sc. Soil &amp; Natural Resource Management<\/li><li>B.Sc. Food Science &amp; Agro-Processing<\/li><li>B.Sc. Agribusiness &amp; Rural Development<\/li><\/ul><\/details>\n<p class=\"muted small\">Official programme titles are shown as published by ADI.<\/p>", "MSC": "\n<p><b>Master's degree<\/b> — Entry requirement (indicative): Bachelor's degree (BSc or equivalent) in a relevant discipline with at least Second Class Lower Division or a minimum GPA of 2.50 on a 4.00 scale. A Third Class degree may be considered after a postgraduate diploma or at least three years of relevant professional experience.<\/p>\n<details class=\"fac\"><summary>Faculty of Health Sciences <span class=\"muted small\">(5 specialties)<\/span><\/summary><ul><li>M.Sc. Nursing<\/li><li>M.Sc. Public Health<\/li><li>M.Sc. Medical Laboratory Science<\/li><li>M.Sc. Pharmacy<\/li><li>M.Sc. Nutrition &amp; Dietetics<\/li><\/ul><\/details><details class=\"fac\"><summary>Faculty of Education <span class=\"muted small\">(6 specialties)<\/span><\/summary><ul><li>M.Ed. Educational Administration &amp; Planning<\/li><li>M.Ed. Curriculum &amp; Instruction<\/li><li>M.Ed. Special Education<\/li><li>M.Ed. Measurement &amp; Evaluation<\/li><li>M.Ed. Educational Technology<\/li><li>M.Ed. Guidance &amp; Counselling<\/li><\/ul><\/details><details class=\"fac\"><summary>School of Social and Management Sciences <span class=\"muted small\">(6 specialties)<\/span><\/summary><ul><li>M.Sc. Accounting<details class=\"small\"><summary>Duration : 2 years (4 semesters) · Credits : 108 (including a 30-credit thesis)<\/summary><p><b>Main courses (Handbook 2025–2026):<\/b> Advanced Financial Accounting I &amp; II, Advanced Management Accounting, Taxation, Accounting Theory &amp; Professional Ethics, Auditing &amp; Assurance, Corporate Governance &amp; Business Law, Research Methods, Public Sector Accounting, Forensic Accounting, Strategic Performance Management, Accounting Information Systems &amp; Data Analytics, Contemporary Issues Seminar, Master's Thesis (ACC 698).<\/p><\/details><\/li><li>M.Sc. Banking and Finance<details class=\"small\"><summary>Duration : 2 years (4 semesters) · Credits : 108<\/summary><p><b>Main courses (Handbook 2025–2026):<\/b> Advanced Corporate Finance, Investment Analysis &amp; Management, Money, Banking &amp; Financial Markets, Financial Econometrics, Bank Management &amp; Operations, Financial Derivatives &amp; Risk Management, Financial Reporting &amp; Analysis, Research Methods, Portfolio Theory, International Finance, Financial Regulation &amp; Ethics, FinTech &amp; Financial Innovation, Contemporary Issues Seminar, Master's Thesis (BFN 698).<\/p><\/details><\/li><li>M.Sc. Management<details class=\"small\"><summary>Duration : 2 years (4 semesters) · Credits : 108<\/summary><p><b>Main courses (Handbook 2025–2026):<\/b> Managerial Theories &amp; Practice, Managerial Finance, Marketing Management, Managerial Economics, Human Resource Management, Operations &amp; Supply Chain Management, Managerial Accounting &amp; Control, Business Research Methods, Strategic Management, International Business Management, Entrepreneurship &amp; New Venture Creation, Business Ethics &amp; Corporate Governance, Contemporary Issues Seminar, Master's Thesis (MGT 698, 30 credits).<\/p><\/details><\/li><li>M.Sc. Human Resource Management<details class=\"small\"><summary>Duration : 2 years (4 semesters) · Credits : 108<\/summary><p><b>Main courses (Handbook 2025–2026):<\/b> Strategic HRM, Organisational Behaviour &amp; Theory, Talent Acquisition &amp; Management, Labour Law &amp; Industrial Relations, Performance &amp; Compensation Management, Training, Development &amp; Career Management, Research Methods for Social Sciences, HR Metrics &amp; Analytics, Organisational Development &amp; Change Management, International HRM, HRIS, Employee Counselling &amp; Workplace Psychology, Contemporary Issues Seminar, Master's Thesis (HRM 698, 30 credits).<\/p><\/details><\/li><li>M.Sc. Project Management<details class=\"small\"><summary>Duration : 2 years (4 semesters) · Credits : 108<\/summary><p><b>Main courses (Handbook 2025–2026):<\/b> Principles of Project Management, Project Finance &amp; Budgeting, Organisational Strategy &amp; Project Selection, Project Scope, Time &amp; Cost Management, Project Risk Management, Project Procurement &amp; Contract Management, Research Methods, Agile &amp; Hybrid Project Management, Program &amp; Portfolio Management, Stakeholder &amp; Communications Management, Project Quality &amp; Performance Management, Contemporary Issues Seminar, Master's Thesis (PJM 698, 30 credits).<\/p><\/details><\/li><li>M.Sc. Transport and Logistics Management<details class=\"small\"><summary>Duration : 2 years (4 semesters) · Credits : 108<\/summary><p><b>Main courses (Handbook 2025–2026):<\/b> Strategic Supply Chain Management, Transport Economics &amp; Policy, Quantitative Analysis for Logistics, Managerial Finance for Logisticians, Global Procurement &amp; Sourcing, Warehouse &amp; Distribution Management, International Trade &amp; Freight Operations, Research Methods, Maritime &amp; Port Management, Air Cargo &amp; Aviation Management, Green Logistics &amp; Sustainable Supply Chains, Logistics Information Systems &amp; Data Analytics, Contemporary Issues Seminar, Master's Thesis (TML 698, 30 credits).<\/p><\/details><\/li><\/ul><\/details><details class=\"fac\"><summary>Faculty of Engineering &amp; Technology <span class=\"muted small\">(7 specialties · Engineering &amp; Technology)<\/span><\/summary><ul><li>M.Tech. Mechanical Engineering<\/li><li>M.Tech. Civil Engineering<\/li><li>M.Tech. Electrical &amp; Electronics Engineering<\/li><li>M.Tech. Computer Engineering<\/li><li>M.Tech. Telecommunications Engineering<\/li><li>M.Tech. Petroleum Engineering<\/li><li>M.Tech. Environmental Engineering<\/li><\/ul><\/details><details class=\"fac\"><summary>Faculty of Agriculture, Food &amp; Environmental Sciences <span class=\"muted small\">(5 specialties)<\/span><\/summary><ul><li>M.Sc. Agronomy<\/li><li>M.Sc. Soil Science &amp; Land Management<\/li><li>M.Sc. Plant Protection<\/li><li>M.Sc. Food Science &amp; Technology<\/li><li>M.Sc. Environmental Management<\/li><\/ul><\/details>\n<p class=\"muted small\">Official programme titles are shown as published by ADI.<\/p>"}}, "fr": {"home": {"eyebrow": "Autorisé par le MINESUP · Yaoundé · Buea", "h1": "Étudiez aujourd'hui. Dirigez demain.", "p": "Programmes HND, BTS, Licence et Master en anglais et en français, dispensés à Yaoundé et à Buea sous l'autorisation du Ministère de l'Enseignement Supérieur (MINESUP).", "mentor": "× Mentorat académique Sous le mentorat de l’Université de Buea L’Institut américain Ditek (ADI) s’appuie sur l’expérience de l’Université de Buea, établissement d’État reconnu, qui l’accompagne dans la qualité de ses programmes, de son enseignement et de son évaluation. Deux institutions, une même exigence : former des diplômés compétents, intègres et prêts à diriger. Lire notre partenariat"}, "util": ["Autorisé par le Ministère de l'Enseignement Supérieur (MINESUP)", "+237 651 187 835\ne.bill@adiuniversity.com"], "fees": "<h2>Frais et calendrier de paiement — 2026/2027<\/h2><p class=\"muted\">par session (étudiants camerounais)<\/p>\n<h3>Frais d'inscription<\/h3><div class=\"tw\"><table class=\"rtab\"><thead><tr><th>Désignation<\/th><th>Montant<\/th><\/tr><\/thead><tbody><tr><td class=\"nw\">Inscription<\/td><td class=\"nw\">50 000 XAF<\/td><\/tr><tr><td>Ouverture du compte d'épargne étudiant (facultatif)<\/td><td class=\"nw\">15 000 XAF<\/td><\/tr><tr><td>T-shirt de l'étudiant<\/td><td class=\"nw\">5 000 XAF<\/td><\/tr><tr><td>Carte d'étudiant<\/td><td class=\"nw\">5 000 XAF<\/td><\/tr><tr><td>Examen médical (Nouvel étudiant / Étudiant ancien)<\/td><td>5 000 XAF / 3 000 XAF<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 class=\"gap\">Scolarité<\/h3><p class=\"muted\">Frais totaux = frais d'inscription + tranches de scolarité. Le compte d'épargne étudiant, facultatif, n'est inclus dans aucun total.<\/p><div class=\"tw\"><table class=\"rtab\"><thead><tr><th>N°<\/th><th>Programme<\/th><th>Inscription<\/th><th>Tranches de scolarité (XAF)<\/th><th>Frais total<\/th><\/tr><\/thead><tbody><tr><td class=\"nw\">A<\/td><td>HND (hors ingénierie)<\/td><td class=\"nw\">50 000 XAF<\/td><td>100 000 · 75 000 · 75 000 · 50 000<\/td><td class=\"nw\"><b>350 000 XAF<\/b><\/td><\/tr><tr><td class=\"nw\">B<\/td><td>HND (ingénierie)<\/td><td class=\"nw\">50 000 XAF<\/td><td>150 000 · 100 000 · 50 000 · 50 000<\/td><td class=\"nw\"><b>400 000 XAF<\/b><\/td><\/tr><tr><td class=\"nw\">C<\/td><td>Licence et Top-Up (Sciences sociales et de gestion, Santé, Éducation, Agriculture)<\/td><td class=\"nw\">50 000 XAF<\/td><td>150 000 · 100 000 · 75 000 · 75 000 · 50 000<\/td><td class=\"nw\"><b>500 000 XAF<\/b><\/td><\/tr><tr><td class=\"nw\">D<\/td><td>Licence (ingénierie)<\/td><td class=\"nw\">50 000 XAF<\/td><td>150 000 · 100 000 · 100 000 · 100 000 · 50 000<\/td><td class=\"nw\"><b>550 000 XAF<\/b><\/td><\/tr><tr><td class=\"nw\">E<\/td><td>Licence professionnelle — Année 1<\/td><td class=\"nw\">50 000 XAF<\/td><td>100 000 · 75 000 · 75 000 · 50 000<\/td><td class=\"nw\"><b>350 000 XAF<\/b><\/td><\/tr><tr><td class=\"nw\">F<\/td><td>Licence professionnelle — Année 2<\/td><td class=\"nw\">50 000 XAF<\/td><td>150 000 · 100 000 · 50 000 · 50 000<\/td><td class=\"nw\"><b>400 000 XAF<\/b><\/td><\/tr><tr><td class=\"nw\">G<\/td><td>Licence professionnelle — Années 3 et 4<\/td><td class=\"nw\">50 000 XAF<\/td><td>150 000 · 125 000 · 100 000 · 75 000<\/td><td class=\"nw\"><b>500 000 XAF<\/b><\/td><\/tr><tr><td class=\"nw\">H<\/td><td>Tous les programmes de Master<\/td><td class=\"nw\">50 000 XAF<\/td><td>200 000 · 150 000 · 150 000 · 100 000 · 100 000<\/td><td class=\"nw\"><b>750 000 XAF<\/b><\/td><\/tr><\/tbody><\/table><\/div>\n<h3 class=\"gap\">Plan de paiement de la scolarité<\/h3><div class=\"tw\"><table class=\"rtab\"><thead><tr><th>Désignation<\/th><th>Période<\/th><\/tr><\/thead><tbody><tr><td>Tranche 1<\/td><td>25 septembre 2026 → 20 octobre 2026<\/td><\/tr><tr><td>Tranche 2<\/td><td>25 octobre 2026 → 20 novembre 2026<\/td><\/tr><tr><td>Tranche 3<\/td><td>3 janvier 2027 → 25 janvier 2027<\/td><\/tr><tr><td>Tranche 4<\/td><td>26 janvier 2027 → 28 février 2027<\/td><\/tr><tr><td>Tranche 5<\/td><td>1 mars 2027 → 15 avril 2027<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 class=\"gap\">Pièces à fournir pour l'admission<\/h3><p class=\"muted\">Les candidats doivent fournir les pièces suivantes :<\/p><ul><li>Une photocopie de l'acte de naissance<\/li><li>Une photocopie de la carte nationale d'identité (ou d'un passeport en cours de validité, pour les étudiants internationaux)<\/li><li>Une copie certifiée conforme du diplôme ou du relevé de notes de l'Advanced Level, ou d'un titre équivalent reconnu<\/li><li>Une copie certifiée conforme du diplôme ou du relevé de notes de l'Ordinary Level, ou d'un titre équivalent reconnu<\/li><li>Une copie certifiée conforme du diplôme HND ou de l'attestation de résultats, ou d'un titre équivalent reconnu (programmes Bachelor Top-Up uniquement)<\/li><li>Une copie certifiée conforme du diplôme de Bachelor ou de l'attestation, ou d'un titre équivalent reconnu (tous les programmes de Master)<\/li><li>Un relevé de notes officiel du Bachelor (candidats aux programmes de Master uniquement)<\/li><\/ul>\n<div class=\"note\">Payez par MoMo au <b>+237678305489 (GLOBAL INVESTMENT CREDIT COOPERATIVE BOD) pour l'inscription et la scolarité, ou +237674225990 (WILLIAM EGBE EBAI) pour tous les autres paiements<\/b>. Les étudiants étrangers doivent fournir un numéro de passeport. Les frais publiés concernent les étudiants camerounais ; frais internationaux : contactez e.bill@adiuniversity.com.<\/div>", "contact": "<div class=\"card\"><h2>Renseignements et réclamations<\/h2><p>Écrivez-nous à <a href=\"mailto:e.bill@adiuniversity.com\">e.bill@adiuniversity.com<\/a>. Chaque demande ou réclamation est enregistrée et traitée par l'administration.<\/p><p>P.O. Box 31460, Yaoundé<br/>+237 651 187 835<br/>🌐 <a class=\"\" href=\"https://www.adiuniversity.com\">www.adiuniversity.com<\/a><\/p><\/div>\n<div><div class=\"card\"><h3>Restez en contact avec nous<\/h3><p class=\"f\"><b>📘 Suivez-nous sur Facebook<\/b><\/p><div class=\"socrow\"><a class=\"socbtn fb\" href=\"https://www.facebook.com/share/1DxLMFTsd8/\"><b>Université ADI – Institut américain Ditek<\/b><span>Pour le public francophone<\/span><\/a><a class=\"socbtn fb\" href=\"https://www.facebook.com/ADIUNIVERSITY\"><b>American Ditek Institute<\/b><span>Pour le public anglophone<\/span><\/a><\/div>\n<p class=\"f\"><b>💬 WhatsApp<\/b><\/p><div class=\"socrow\"><a class=\"socbtn wa\" href=\"https://wa.me/237657936576?text=Bonjour%20Universit%C3%A9%20ADI%2C%20\"><b>Campus de Yaoundé<\/b><span>Correspondance en français · <span class=\"nw\">+237 657 936 576<\/span><\/span><\/a><a class=\"socbtn wa\" href=\"https://wa.me/237651187835?text=Bonjour%20Universit%C3%A9%20ADI%2C%20\"><b>Campus de Yaoundé<\/b><span>Correspondance en anglais · <span class=\"nw\">+237 651 187 835<\/span><\/span><\/a><a class=\"socbtn wa\" href=\"https://wa.me/237651044896?text=Bonjour%20Universit%C3%A9%20ADI%2C%20\"><b>Campus de Buea<\/b><span><span class=\"nw\">+237 651 044 896<\/span><\/span><\/a><\/div><\/div><div class=\"card gap\"><h3>Payez par MoMo au <b>+237678305489 (GLOBAL INVESTMENT CREDIT COOPERATIVE BOD) pour l'inscription et la scolarité, ou +237674225990 (WILLIAM EGBE EBAI) pour tous les autres paiements<\/b><\/h3><p class=\"muted\">1) Envoyez le montant par MoMo au +237678305489 (GLOBAL INVESTMENT CREDIT COOPERATIVE BOD) pour l'inscription et la scolarité, ou +237674225990 (WILLIAM EGBE EBAI) pour tous les autres paiements. 2) Saisissez l'identifiant de transaction reçu. 3) Le service financier confirme et votre reçu devient officiel.<\/p><\/div><\/div>", "prog": {"HND": "\n<p><b>HND — Diplôme National Supérieur<\/b> — Conditions d'accès (indicatif): GCE Advanced Level (2 matières) ou Baccalauréat / équivalent.<\/p>\n<details class=\"fac\"><summary>Filière de Gestion <span class=\"muted small\">(17 spécialités)<\/span><\/summary><ul><li>Management Assistant<\/li><li>Human Resources Management<\/li><li>Logistics and Transportation Management<\/li><li>Project Management<\/li><li>Information Systems Management<\/li><li>Business Administration<\/li><li>Public Administration<\/li><li>Operation of Air Transport<\/li><li>Management of NGOs<\/li><li>Quality Management<\/li><li>Sport Management<\/li><li>Local Government Management (Accounting and Finance)<\/li><li>Local Government Management (Taxation)<\/li><li>Local Government Management (Administration)<\/li><li>Statistics<\/li><li>Events Management<\/li><li>Ports and Shipping Management<\/li><\/ul><\/details><details class=\"fac\"><summary>Filière d'Ingénierie et de Technologie <span class=\"muted small\">(12 spécialités · Ingénierie et Technologie)<\/span><\/summary><ul><li>Software Engineering<\/li><li>Hardware Maintenance<\/li><li>Network and Security<\/li><li>Telecommunications s &amp; Sustainable Supply Chains, Logistics Information Systems &amp; Data Analytics, Contemporary Issues Seminar, Master's Thesis (TML 698, 30 credits).<\/p><\/details><\/li><\/ul><\/details><details class=\"fac\"><summary>Faculté d'Ingénierie et de Technologie <span class=\"muted small\">(7 spécialités · Ingénierie et Technologie)<\/span><\/summary><ul><li>M.Tech. Mechanical Engineering<\/li><li>M.Tech. Civil Engineering<\/li><li>M.Tech. Electrical &amp; Electronics Engineering<\/li><li>M.Tech. Computer Engineering<\/li><li>M.Tech. Telecommunications Engineering<\/li><li>M.Tech. Petroleum Engineering<\/li><li>M.Tech. Environmental Engineering<\/li><\/ul><\/details><details class=\"fac\"><summary>Faculté d'Agriculture, des Sciences Alimentaires et de l'Environnement <span class=\"muted small\">(5 spécialités)<\/span><\/summary><ul><li>M.Sc. Agronomy<\/li><li>M.Sc. Soil Science &amp; Land Management<\/li><li>M.Sc. Plant Protection<\/li><li>M.Sc. Food Science &amp; Technology<\/li><li>M.Sc. Environmental Management<\/li><\/ul><\/details>\n<p class=\"muted small\">Les intitulés officiels des programmes sont affichés tels que publiés par l’ADI.<\/p>"}}};
