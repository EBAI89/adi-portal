# Builds the ADI staff app (Transcript Office working offline) and publishes it under "Releases".
# The students' records, the seal and the signatures are packed sealed (android/staff/sealed): the app opens only with the
# activation code, which is not in this repository. The public app is built by android-apk.yml.
name: Build staff APK

on:
  push:
    branches: [android-app, main]
    paths:
      - 'android/staff/**'
      - 'adi-docreg.js'
      - '.github/workflows/staff-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  staff:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Pack the portal into the app
        run: node android/staff/build-assets.mjs 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Build the signed APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :staff:assembleRelease 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          cp staff/build/outputs/apk/release/staff-release.apk "$RUNNER_TEMP/ADI-Staff.apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$RUNNER_TEMP/ADI-Staff.apk" | tee -a "$RUNNER_TEMP/build.log" || true

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/ADI-Staff.apk" "$RUNNER_TEMP/ADI-Transcripts-Staff.apk"
          gh release create "staff-v1.0.${GITHUB_RUN_NUMBER}" "$RUNNER_TEMP/ADI-Transcripts-Staff.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "ADI Transcripts (staff) 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "For authorised ADI staff only. The app opens only with the activation code issued by the Administrative Director; without it, it holds nothing readable."

      - name: Save the build log when the build fails
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/log" && cd "$RUNNER_TEMP/log"
          tail -n 300 "$RUNNER_TEMP/build.log" > build-log.txt 2>/dev/null || echo "no build log" > build-log.txt
          git init -q && git checkout -q -b staff-build-log
          git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build-log.txt && git commit -q -m "Staff build log (run ${GITHUB_RUN_NUMBER})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" staff-build-log
